version: '3.8'
services:
  db:
    image: postgres:14.8
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: crm_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      - DATABASE_URL=postgres://crm_user:crm_password@db:5432/crm_prod
      - JWT_SECRET=super_secret_production_key_change_me
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - db

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata_prod:
